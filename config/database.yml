# PostgreSQL, same adapter in every environment. Connection details come from
# the environment so the same image runs unmodified against a local
# docker-compose Postgres and against RDS in production.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "gwars") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "gwars") %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "gwars_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "gwars_test") %>

production:
<% if ENV["DATABASE_URL"].to_s != "" %>
  # Some hosts (Koyeb's managed Postgres, among others) only ever hand you a
  # connection string, not separate host/user/password fields — honor it
  # directly rather than making every host conform to DATABASE_HOST etc.
  url: <%= ENV["DATABASE_URL"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
<% else %>
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "gwars_production") %>
<% end %>
